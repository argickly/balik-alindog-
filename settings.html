    </nav>
</header>


<main class="container">

<div class="section-head">
    <div>
        <h2>Settings</h2>
        <p>Manage your account settings and appearance.</p>
    </div>
</div>

<section class="panel">
    <h3>Change Password</h3>

    <div class="form-grid">
        <div class="field">
            <label>Current Password</label>
            <input type="password" placeholder="Current password">
        </div>

        <div class="field">
            <label>New Password</label>
            <input type="password" placeholder="New password">
        </div>
    </div>

    <div class="program-actions">
        <button class="btn btn-dark">Update Password</button>
    </div>
</section>

<section class="panel">
    <h3>Appearance</h3>

    <div class="theme-switcher">
        <button class="btn btn-outline" type="button" onclick="setTheme('light')">Light Mode</button>
        <button class="btn btn-dark" type="button" onclick="setTheme('dark')">Dark Mode</button>
    </div>
</section>

<section class="panel">
    <h3>Preferences</h3>

    <div class="field">
        <label>Reminder Preference</label>
        <select>
            <option>Show in-system reminders</option>
            <option>Hide in-system reminders</option>
        </select>
    </div>
</section>

</main>

<script src="assets/js/app.js"></script>
</body>
